<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>门店日结</title>
<!-- 添加到 iPhone 主屏幕后：用 Rios 图标、全屏打开 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="门店日结">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbynXyIFg4PVHJquD7KF7Sq7KJqtbCPfJr59bipC5xCG_e_yeo8akz0wfnnAt_6f-DMLtw/exec"
  title="门店日结"
  allow="clipboard-write; camera"></iframe>
<script>
/* 记住登录：Safari 不让框里的记账网页长期保存登录，所以由这个外壳页面替它保存。
   只替自己框里的记账网页（Google Apps Script 的网址）存取；外壳被别的网页套住时不工作。 */
(function(){
  var frame = document.getElementById('app');
  var KEY = 'll';
  var okOrigin = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  function fromOurApp(src){
    try { for (var w = src, i = 0; w && i < 6; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) return false; w = w.parent; } } catch (e) {}
    return false;
  }
  window.addEventListener('message', function(e){
    if (window.top !== window || !okOrigin.test(e.origin) || !fromOurApp(e.source)) return;
    var d = e.data || {};
    if (d.t === 'll-get') {
      var v = null; try { v = localStorage.getItem(KEY); } catch (err) {}
      e.source.postMessage({ t: 'll-val', id: d.id, v: v }, e.origin);
    } else if (d.t === 'll-set') {
      var ok = true, msg = '';
      try { typeof d.v === 'string' && d.v ? localStorage.setItem(KEY, d.v) : localStorage.removeItem(KEY); } catch (err) { ok = false; msg = String(err && err.name || err); }
      var back = false; try { back = !!localStorage.getItem(KEY); } catch (err) {}
      e.source.postMessage({ t: 'll-ack', id: d.id, ok: ok, back: back, err: msg }, e.origin);
    }
  });
})();
</script>
</body>
</html>
